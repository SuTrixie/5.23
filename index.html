<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日快乐 · Chris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page" role="application" aria-label="庆生页面">
      <div class="bg" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <main class="content">
        <button type="button" class="hb-btn" id="celebrateBtn" aria-describedby="counterLine">
          Happy Birthday
        </button>
        <p class="counter" id="counterLine">
          祝Chris生日快乐的第 <span class="counter-num" id="countNum">0</span> 次
        </p>
      </main>

      <div class="balloon-layer" id="balloonLayer" aria-hidden="true"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
